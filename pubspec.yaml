name: skillo
description: "Skillo - plateforme d'évaluation en ligne (Java, Algorithmes, HTML/CSS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  percent_indicator: ^4.2.5
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

# Icône de l'application (générée par `dart run flutter_launcher_icons`).
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#FFD60A"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  web:
    generate: false
