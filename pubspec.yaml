name: reine
description: "Reine - plateforme d'évaluation en ligne (Java, Algorithmes, HTML/CSS)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  crypto: ^3.0.8
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  intl: ^0.20.3
  percent_indicator: ^4.2.5
  provider: ^6.1.5+1
  sqflite: ^2.4.5
  sqflite_common: ^2.5.14
  sqflite_common_ffi: ^2.4.5
  sqflite_common_ffi_web: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/questions/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
